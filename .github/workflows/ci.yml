name: CI
on:
  push:
    branches: [ main, master, 'release/**' ]
  # CI minutes cost money on a private repo, so pull requests are checked only when they are
  # ready: draft PRs skip every job; marking a PR "Ready for review" runs it once, and each
  # later push cancels the run it replaces. "Run workflow" on the Actions tab starts one by hand.
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
  workflow_dispatch:

# A new push to a PR/branch cancels that ref's still-running CI. Runs on main/master each get a
# unique group (the run id), so they are never cancelled or queued behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SHARDS: 4   # number of backend test shards; keep in sync with the `test` job's matrix

# Least privilege: the token can read the repo and nothing else.
permissions:
  contents: read

jobs:
  lint-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      ENVIRONMENT: test
      SEED_DEMO: "false"
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
      - name: Lint (core + tests)
        run: ruff check main.py backend/config.py backend/core backend/db backend/tests
      - name: Verify migrations build the schema from scratch
        # Hard gate: a clean `alembic upgrade head` must succeed. This is what catches a broken
        # migration (e.g. a duplicate index, or SQLite-incompatible batch DDL) before it reaches a
        # production deploy, where the app runs migrations rather than create_all.
        run: alembic -c backend/alembic.ini upgrade head
      - name: Shop-clock subset with the server far from UTC
        # Memberships and money dates must follow the shop's day, not the server's (council Q2).
        # Between them the two zones are off the UTC date at every hour of the day.
        run: |
          S="backend/tests/test_shop_clock_memberships.py backend/tests/test_memberships.py backend/tests/test_shop_timezone_today.py backend/tests/test_billing.py"
          TZ=Pacific/Kiritimati pytest -q -n auto $S
          TZ=Pacific/Pago_Pago pytest -q -n auto $S

  test:
    # The suite is split into parallel shards (whole files, balanced by test count — see the
    # sharding hook at the end of backend/tests/conftest.py). Each shard runs its slice with xdist
    # and uploads raw coverage data; the `coverage` job combines them and enforces the floor.
    name: test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40  # ~2-3x a normal run; a timeout is a hang to investigate (TESTING.md), not a rerun
    strategy:
      fail-fast: false   # let every shard report its failures
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ENVIRONMENT: test
      SEED_DEMO: "false"
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      PYTEST_SHARD: ${{ matrix.shard }}
      PYTEST_SHARD_TOTAL: ${{ strategy.job-total }}
      PYTEST_SHARD_MANIFEST: coverage-data/shard-${{ matrix.shard }}.txt
      COVERAGE_FILE: coverage-data/.coverage.shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests (this shard)
        # Includes the HARD model/migration drift gate (test_144eo_migrated_schema.py): migrations must
        # build exactly the schema the models describe, minus a reviewed allowlist that can only shrink.
        # parallel (conftest isolates each worker on its own SQLite file) + branch coverage. A single
        # shard covers only part of the code, so the floor is enforced on the combined data in the
        # `coverage` job, not here.
        run: |
          mkdir -p coverage-data
          pytest -q -n auto --cov --cov-report= --cov-fail-under=0
      - name: Upload shard coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-data/
          include-hidden-files: true   # .coverage.* data files are dotfiles
          if-no-files-found: error
          retention-days: 3

  coverage:
    # Aggregate gate: fails if any shard failed, if the shards did not run exactly the full suite,
    # or if combined coverage is below the ratchet floor in pyproject [tool.coverage.report] fail_under.
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      SEED_DEMO: "false"
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
    steps:
      - name: All shards passed
        if: ${{ needs.test.result != 'success' }}
        run: |
          echo "test shards: ${{ needs.test.result }}"; exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-shard-*
          path: coverage-data
          merge-multiple: true
      - name: Shards ran exactly the full suite
        shell: bash   # -eo pipefail: a collection error fails the step
        run: |
          pytest -q --collect-only | grep '::' | sort > all-tests.txt
          cat coverage-data/shard-*.txt | sort > sharded-tests.txt
          echo "collected: $(wc -l < all-tests.txt)  sharded: $(wc -l < sharded-tests.txt)  unique: $(sort -u sharded-tests.txt | wc -l)"
          ls coverage-data/shard-*.txt | wc -l | grep -qx "$SHARDS" || { echo "expected $SHARDS shard manifests"; exit 1; }
          diff all-tests.txt sharded-tests.txt
      - name: Combine coverage + enforce floor
        run: |
          coverage combine coverage-data/
          coverage report
          coverage xml
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-backend
          path: coverage.xml
          if-no-files-found: ignore

  backend-postgres:
    # Production runs Postgres 16; the main job runs on SQLite (fast but lenient about types,
    # constraints and SQL dialect). This job runs migrations from scratch AND the full suite on a
    # real Postgres so prod-only failures surface in CI, not at deploy.
    # A HARD gate (it was advisory until it had a long green record: every red run since sharding
    # was a real bug that also failed SQLite). Sharded like `test` (same conftest hook); every matrix
    # job gets its own Postgres container, and inside it conftest gives each xdist worker its own
    # database, created at start and dropped at the end. If the server itself fails, the run stops
    # with "INFRASTRUCTURE ERROR" and exit code 75: rerun the job; never read that as a pass.
    name: backend-postgres (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 45  # normal run 12-20 min
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repairos
          POSTGRES_PASSWORD: repairos
          POSTGRES_DB: repairos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repairos"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ENVIRONMENT: test
      SEED_DEMO: "false"
      PGPASSWORD: repairos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
      - name: Postgres 16 client tools
        # pg_dump/pg_restore for the restore drill and its tests (the server is Postgres 16; an
        # older client refuses to dump it).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
      - name: Migrations from scratch on Postgres
        # Once, not per shard. Separate database so the migration run never collides with the
        # suite's create_all.
        if: ${{ matrix.shard == 1 }}
        env:
          DATABASE_URL: postgresql+asyncpg://repairos:repairos@localhost:5432/repairos_mig
        run: |
          psql -h localhost -U repairos -d repairos_test -c "CREATE DATABASE repairos_mig"
          alembic -c backend/alembic.ini upgrade head
      - name: Restore drill on the migrated database
        # Dump it, restore it into a scratch database, and check version, row counts and the
        # integrity sweep (scripts/restore_drill.py; DEPLOY.md section 4).
        if: ${{ matrix.shard == 1 }}
        env:
          DATABASE_URL: postgresql+asyncpg://repairos:repairos@localhost:5432/repairos_mig
        run: python scripts/restore_drill.py
      - name: Test suite on Postgres (this shard)
        # Parallel: each worker works in its own database (repairos_test_<run>_gwN) on this server.
        env:
          DATABASE_URL: postgresql+asyncpg://repairos:repairos@localhost:5432/repairos_test
          TEST_DATABASE_URL: postgresql+asyncpg://repairos:repairos@localhost:5432/repairos_test
          PYTEST_SHARD: ${{ matrix.shard }}
          PYTEST_SHARD_TOTAL: ${{ strategy.job-total }}
        run: pytest -q -n auto

  backend-postgres-all:
    # The one check to list as required in branch protection: red unless every Postgres shard passed
    # (a shard that failed, was cancelled or timed out all count as red).
    name: backend-postgres (all shards)
    needs: backend-postgres
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All Postgres shards passed
        run: |
          echo "backend-postgres shards: ${{ needs.backend-postgres.result }}"
          test "${{ needs.backend-postgres.result }}" = success

  website-legal:
    # The Terms and Privacy pages shops agree to at sign-up still carry [[...]] tokens until the
    # founder supplies the company's legal details. The built pages are committed, so this checks
    # what would actually be deployed. It only warns for now so it doesn't block every PR into
    # main; drop --warn-only once the legal details are filled in.
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No legal placeholders in the served pages
        run: python3 website/tools/check_legal_placeholders.py --warn-only

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"   # jsdom 30 + undici (lockfile) need Node >= 22.19
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: UI-text lint (no raw snake_case in labels)
        run: npm run lint:uitext
      - name: Design drift check (no new hand-made buttons, tabs, colours or sizes)
        run: npm run lint:design
      - name: Unit tests + coverage floor (Vitest)
        run: npm run test:coverage
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-frontend
          path: frontend-react/coverage/lcov.info
          if-no-files-found: ignore
      - name: Build
        run: npm run build
