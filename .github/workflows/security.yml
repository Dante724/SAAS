name: Security checks
# Required gates that don't depend on the test matrix (kept separate from ci.yml so the CI
# speed-up / Postgres-sharding work can evolve that file independently).
on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-deps:
    name: pip-audit (locked dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit==2.9.0
      # --disable-pip: audit the exact hashed pins without resolving a new environment.
      - run: pip-audit -r requirements.lock --disable-pip --strict

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --exit-code 1

  lint-correctness:
    name: ruff correctness rules (whole backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      # Pyflakes (undefined names, unused/redefined imports, unused variables) + syntax errors on
      # every module — ci.yml's lint covers only core/db/tests. An un-imported notify() in
      # routers/orders.py silently disabled assignment alerts until this gate existed.
      - run: ruff check backend main.py scripts --select F,E9
