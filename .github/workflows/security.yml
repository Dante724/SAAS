name: Security checks
# Required gates that don't depend on the test matrix (kept separate from ci.yml so the CI
# speed-up / Postgres-sharding work can evolve that file independently).
on:
  push:
    branches: [ main, master, 'release/**' ]
  # CI minutes cost money on a private repo, so pull requests are checked only when they are
  # ready: draft PRs skip every job; marking a PR "Ready for review" runs it once, and each
  # later push cancels the run it replaces. "Run workflow" on the Actions tab starts one by hand.
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: the token can read the repo and nothing else.
permissions:
  contents: read

jobs:
  python-deps:
    name: pip-audit (locked dependencies)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit==2.9.0
      # --disable-pip: audit the exact hashed pins without resolving a new environment.
      - run: pip-audit -r requirements.lock --disable-pip --strict

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --exit-code 1

  lint-correctness:
    name: ruff correctness rules (whole backend)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      # Pyflakes (undefined names, unused/redefined imports, unused variables) + syntax errors on
      # every module — ci.yml's lint covers only core/db/tests. An un-imported notify() in
      # routers/orders.py silently disabled assignment alerts until this gate existed.
      - run: ruff check backend main.py scripts --select F,E9

  npm-deps:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # What ships to browsers must be clean. Dev-only tooling (vite/vitest/tailwind) is
      # tracked separately: those fixes need major-version migrations.
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: frontend-react
