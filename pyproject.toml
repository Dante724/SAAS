[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["backend/migrations", "*.tsx", "*.ts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",  # line length handled by formatter, not enforced
  "B008",  # FastAPI idiom: Depends()/File() in argument defaults
  "B904",  # raise-from not required for HTTPException re-raises
  "E402",  # conftest/env set os.environ before imports by design
]

[tool.ruff.lint.per-file-ignores]
# Tests: unused/redefined imports (fixtures), compact one-line setups (E702) and short loop vars
# like `l` (E741) are cosmetic in test code and can't hide a bug — allowed. Real-signal rules
# (F841 unused vars, E711, B017, etc.) stay enforced.
"backend/tests/*" = ["F401", "F811", "E702", "E741"]
