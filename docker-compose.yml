version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: repairos_db
    environment:
      POSTGRES_USER: repairos
      POSTGRES_PASSWORD: repairos
      POSTGRES_DB: repairos
    ports:
      - "127.0.0.1:5432:5432"   # this machine only, not the network
    volumes:
      - pgdata:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:9.19   # pinned: "latest" changes under you
    container_name: repairos_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres
volumes:
  pgdata:
