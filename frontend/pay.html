<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>Pay — Tekly</title>
<link rel="icon" type="image/svg+xml" href="/static/icons/tekly-mark.svg">
<style>
  html,body{height:100%;margin:0;background:#0f1020;color:#e9e9f2;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
  .card{width:100%;max-width:380px;margin:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:26px;text-align:center}
  .logo{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;background:linear-gradient(160deg,#6366f1,#8b5cf6)}
  h1{font-size:18px;margin:0 0 4px}.sub{color:#9a9ab5;font-size:13px;margin:0 0 18px}
  .amt{font-size:40px;font-weight:800;margin:8px 0}
  .ord{color:#9a9ab5;font-size:13px;margin-bottom:18px}
  button{width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(160deg,#6366f1,#8b5cf6);min-height:54px}
  .paid{color:#34d399;font-weight:800;font-size:18px;margin:14px 0}
  .err{color:#fb7185;font-size:13px;margin-top:10px}
  .items{text-align:left;margin:0 0 16px;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
  .items .row{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;font-size:13px}
  .items .row .d{color:#c9c9dc}.items .row .t{color:#e9e9f2;font-weight:700;white-space:nowrap}
</style></head><body>
<div class="card" id="card"><div class="sub">Loading…</div></div>
<script>
  const id = location.pathname.split('/').pop();
  const card = document.getElementById('card');
  const money = (a, c) => new Intl.NumberFormat(undefined, { style: 'currency', currency: (c || 'usd').toUpperCase() }).format(a || 0);
  async function load() {
    let d;
    try { d = await (await fetch('/api/public/pay/' + id)).json(); }
    catch (e) { card.innerHTML = '<div class="err">Could not load this payment.</div>'; return; }
    if (d.status === 'succeeded' || d.status === 'paid') { return paid(); }
    if (d.provider !== 'simulated' && (d.status === 'pending' || d.status === 'created')) {
      // Live providers: poll once in case the customer already paid on the hosted page.
      try { const r = await (await fetch('/api/payments/intents/' + id + '/refresh', { method: 'POST' })).json();
            if (r.status === 'succeeded') return paid(); } catch (e) {}
    }
    const items = (d.lines && d.lines.length) ? `<div class="items">${d.lines.map(l =>
        `<div class="row"><span class="d">${(l.description || '').replace(/[<>&]/g, '')}${l.qty > 1 ? ' × ' + l.qty : ''}</span><span class="t">${money(l.total, d.currency)}</span></div>`).join('')}</div>` : '';
    const ref = d.invoice_number ? 'Invoice ' + d.invoice_number : (d.order_number ? 'Order ' + d.order_number : '');
    card.innerHTML = `<div class="logo"></div><h1>Payment request</h1>
      <div class="sub">Tekly</div>
      <div class="amt">${money(d.amount, d.currency)}</div>
      <div class="ord">${ref}</div>
      ${items}
      <button id="pay">Pay ${money(d.amount, d.currency)}</button>
      <div class="err" id="err"></div>`;
    document.getElementById('pay').addEventListener('click', () => pay(d));
  }
  async function pay(d) {
    const btn = document.getElementById('pay'); btn.textContent = 'Processing…'; btn.disabled = true;
    // Live gateway: hand off to its hosted checkout. Simulated: confirm via the public hook.
    if (d.provider !== 'simulated' && d.checkout_url) { location.href = d.checkout_url; return; }
    try {
      const r = await fetch((d.checkout_url || ('/api/payments/intents/' + id + '/simulate-pay')), { method: 'POST' });
      if (!r.ok) throw new Error('failed');
      paid();
    } catch (e) { document.getElementById('err').textContent = 'Payment failed. Please try again.'; btn.textContent = 'Pay'; btn.disabled = false; }
  }
  function paid() { card.innerHTML = '<div class="logo"></div><div class="paid">✓ Payment received</div><div class="sub">Thank you. You can close this page.</div>'; }
  load();
</script>
</body></html>
