<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — Tekly</title>
<link rel="icon" type="image/svg+xml" href="/static/icons/tekly-mark.svg">
<style>
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#0f1020;color:#e7e7f0;display:flex;align-items:center;justify-content:center;text-align:center}
  .wrap{padding:32px;max-width:340px}
  .badge{width:72px;height:72px;border-radius:20px;margin:0 auto 18px;
    background:linear-gradient(160deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:34px}
  h1{font-size:20px;margin:0 0 8px}p{color:#a7a7c0;line-height:1.5;font-size:14px;margin:0 0 20px}
  button{background:#6366f1;color:#fff;border:0;border-radius:12px;padding:13px 22px;font-size:15px;font-weight:600;min-height:48px}
</style></head><body>
<div class="wrap">
  <div class="badge">⚡</div>
  <h1>You're offline</h1>
  <p>Your assigned jobs are saved on this device. Reconnect to sync changes, or keep working — everything you do offline is queued and uploaded automatically.</p>
  <form action="/tech"><button>Open my jobs</button></form>
</div>
</body></html>
